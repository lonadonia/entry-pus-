worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Allow large image uploads
    client_max_body_size 50M;

    # Upstream Flask/Gunicorn
    upstream flask_app {
        server web:5000;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        # ── TLS (self-signed certificate for IP-based HTTPS) ──
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Static assets (served directly by nginx) ──
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Root-level favicon shortcut for browsers that auto-request
        # /favicon.ico without consulting <link rel="icon">.
        location = /favicon.ico {
            alias /app/static/favicon.ico;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
            log_not_found off;
        }

        # ── Generated design files (served directly by nginx for speed) ──
        # Mounted from ./storage on the host. Flask also has a /storage/<path>
        # route as a fallback when nginx isn't in front.
        location /storage/ {
            alias /app/storage/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ── Socket.IO WebSocket ───────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # ── All other requests → Gunicorn ─────────────────────────────────────
        location / {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_buffers         8 16k;
            proxy_buffer_size     32k;
        }
    }

    # >>> growmaz.com: managed by /usr/local/sbin/growmaz-nginx-apply (see /var/www/growmaz/shared/README.txt)
    # Growmaz website over HTTPS (certificate from Let's Encrypt, renewed by
    # certbot.timer; see /var/www/growmaz/shared/README.txt). The server block
    # above stays the default for every other hostname and for requests by IP.
    server {
        listen 80;
        server_name growmaz.com;

        location ^~ /.well-known/acme-challenge/ {
            proxy_pass       http://172.17.0.1:8089;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://growmaz.com$request_uri;
        }
    }

    # www.growmaz.com is not covered by the certificate yet. Its plain-HTTP
    # requests go to the HTTPS site, so nothing is served unencrypted.
    server {
        listen 80;
        server_name www.growmaz.com;

        location ^~ /.well-known/acme-challenge/ {
            proxy_pass       http://172.17.0.1:8089;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://growmaz.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.growmaz.com;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name growmaz.com;

        ssl_certificate     /etc/nginx/tls/growmaz.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/growmaz.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Request bodies: the site's forms post at most 1 MB.
        client_max_body_size 2m;

        location / {
            proxy_pass         http://172.17.0.1:3100;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Private mailing dashboard: never stored by browsers or shared caches.
        location ^~ /mailing {
            proxy_pass         http://172.17.0.1:3100;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, private" always;
        }

        # Mailing uploads: CSV imports (5 MB file) and reply attachments
        # (20 MB in total). The application enforces the exact limits.
        location ^~ /mailing/api/ {
            client_max_body_size 25m;
            proxy_pass         http://172.17.0.1:3100;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, private" always;
        }
    }
    # <<< growmaz.com

    # >>> maroc.growmaz.com: managed by /usr/local/sbin/growmaz-maroc-nginx-apply (see /var/www/growmaz-maroc/README.txt)
    # maroc.growmaz.com: static site served by growmaz-maroc.service
    # (172.17.0.1:3200), certificate for this hostname only (certbot,
    # renewed by certbot.timer; see /var/www/growmaz-maroc/README.txt).
    server {
        listen 80;
        server_name maroc.growmaz.com;
        location ^~ /.well-known/acme-challenge/ {
            proxy_pass       http://172.17.0.1:8089;
            proxy_set_header Host $host;
        }
        location / {
            return 301 https://maroc.growmaz.com$request_uri;
        }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name maroc.growmaz.com;
        ssl_certificate     /etc/nginx/tls/maroc.growmaz.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/maroc.growmaz.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        client_max_body_size 1m;
        add_header Strict-Transport-Security "max-age=86400" always;
        location / {
            proxy_pass         http://172.17.0.1:3200;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
    # <<< maroc.growmaz.com
}
